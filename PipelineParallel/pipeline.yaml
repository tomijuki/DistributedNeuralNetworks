apiVersion: v1
kind: Service
metadata:
  name: mnist-pipeline
spec:
  clusterIP: None              # Headless service for stable DNS per pod
  selector:
    app: mnist-pipeline
  ports:
  - { name: rdzv, port: 29500 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mnist-pipeline
spec:
  serviceName: mnist-pipeline
  replicas: 4
  podManagementPolicy: Parallel    # Launches all 4 stages simultaneously
  selector:
    matchLabels:
      app: mnist-pipeline
  template:
    metadata:
      labels:
        app: mnist-pipeline
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: mnist-pipeline
            topologyKey: kubernetes.io/hostname
      containers:
      - name: pytorch
        image: mnist-pipeline:latest  # Make sure to tag your built image as this
        imagePullPolicy: Always
                # NET_ADMIN lets `tc` change this pod's qdisc for fault injection
        # (experiment4.sh). Scoped to the pod's own netns, not the host.
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        command: ["/bin/sh", "-c"]
        args:
        - |
          NODE_RANK="$(hostname | sed 's/.*-//')"   # Extracts stage index (0-3) from pod name
          echo "host=$(hostname) node_rank=$NODE_RANK"
          torchrun --nnodes=4 --nproc_per_node=1 \
            --node_rank="$NODE_RANK" \
            --master_addr=mnist-pipeline-0.mnist-pipeline --master_port=29500 \
            main.py
          echo "=== training done; pod staying up for collection ==="
          sleep infinity
        env:
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        volumeMounts:
        - name: output
          mountPath: /app/runs
          subPath: runs
        - name: output
          mountPath: /app/models
          subPath: models
  volumeClaimTemplates:
  - metadata:
      name: output
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path     # Uses local-path provisioning within KinD
      resources:
        requests:
          storage: 1Gi