# DDP as a StatefulSet: stable hostnames (mnist-ddp-0..3), static rendezvous
# so rank 0 == pod mnist-ddp-0 deterministically, per-pod local-path volumes.
apiVersion: v1
kind: Service
metadata:
  name: mnist-ddp
spec:
  clusterIP: None
  selector:
    app: mnist-ddp
  ports:
  - { name: rdzv, port: 29500 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mnist-ddp
spec:
  serviceName: mnist-ddp
  replicas: 4
  podManagementPolicy: Parallel    # start all 4 at once (rendezvous needs them together)
  selector:
    matchLabels:
      app: mnist-ddp
  template:
    metadata:
      labels:
        app: mnist-ddp
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: mnist-ddp
            topologyKey: kubernetes.io/hostname
      containers:
      - name: pytorch
        image: mnist-ddp:latest
        imagePullPolicy: Always
        # NET_ADMIN lets `tc` change this pod's qdisc for fault injection.
        # Scoped to the pod's own network namespace, not the host.
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        command: ["/bin/sh", "-c"]
        args:
        - |
          NODE_RANK="$(hostname | sed 's/.*-//')"   # mnist-ddp-2 -> 2
          echo "host=$(hostname) node_rank=$NODE_RANK"
          torchrun --nnodes=4 --nproc_per_node=1 \
            --node_rank="$NODE_RANK" \
            --master_addr=mnist-ddp-0.mnist-ddp --master_port=29500 \
            main.py
          echo "=== training done; pod staying up for collection ==="
          sleep infinity
        env:
        - name: GLOO_SOCKET_IFNAME
          value: "eth0"
        volumeMounts:
        - name: output
          mountPath: /app/runs
          subPath: runs
        - name: output
          mountPath: /app/models
          subPath: models
  volumeClaimTemplates:
  - metadata:
      name: output
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi